name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'dist/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Fixed Keystore
        run: |
          test -f android/app/release.keystore
          echo "Fixed release keystore verified."

      - name: Build Release APK
        run: |
          cd android
          gradle :app:assembleRelease --stacktrace

      - name: Package Output APK
        run: |
          mkdir -p release-apk
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} release-apk/Mikutap.apk \;
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mikutap-APK
          path: release-apk/Mikutap.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release-apk/Mikutap.apk --title "Mikutap Android App ${{ github.ref_name }}" --generate-notes
