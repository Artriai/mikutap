name: Validate VCV and CVVC pipeline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install offline audio encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Frontend regression
        run: npm run check
      - name: Offline render-grid and sprite regression
        run: npm run test:tools
